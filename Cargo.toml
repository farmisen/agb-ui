[package]
name = "agb-ui"
version = "0.1.1"
edition = "2024"
description = "Menus for agb games: a headless core (rows, choices, scrolling, BACK, disabled rows) and an optional layout and redraw helper"
license = "MIT OR Apache-2.0"
repository = "https://github.com/farmisen/agb-ui"
readme = "README.md"
keywords = ["gba", "agb", "menu", "no-std"]
categories = ["game-development", "no-std"]
# Taken as a git dependency pinned to a tag, not from crates.io.
publish = false

[dependencies]
# Only for reading the buttons (`Input::from(&ButtonController)`). Without it the crate
# builds for the host, where its tests run.
agb = { version = "0.25", optional = true }

[features]
default = ["agb"]
agb = ["dep:agb"]
